name: smart_routine_mobile
description: "Smart Routine & Management Mobile App for Students"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # UI and Material
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # State Management & Routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Networking & Storage
  dio: ^5.7.0
  shared_preferences: ^2.3.3

  # Notifications & Utilities
  flutter_local_notifications: ^18.0.1
  intl: ^0.19.0
  uuid: ^4.5.1

dependency_overrides:
  shared_preferences_android: 2.3.4
  path_provider_android: 2.2.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
